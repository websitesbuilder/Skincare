<body>

<header class="navbar">
  <div class="logo">Glow Skincare</div>

  <nav>
    <a href="#">Skin Type</a>
    <a href="#">Concerns</a>
    <a href="#">Expert Advice</a>
    <a href="#">Body Care</a>
    <a href="#">Lifestyle</a>
  </nav>
</header>

<header class="hero">
  <div class="hero-content">

    <img src="logo.png" alt="Glow Skincare Logo" class="logo">

    <h1>YOUR BEST SKIN STARTS HERE</h1>

    <p class="tagline">
      Radiance starts with self-care. Discover personalized skincare that actually works.
    </p>

    <a href="#product-list" class="cta">Find Your Routine</a>

  </div>
</header>

<section class="products" id="product-list"></section>

<div class="cart">
  <h2>Your Cart</h2>
  <ul id="cart-items"></ul>
  <p>Total: $<span id="total">0</span></p>
  <button onclick="checkout()">Pay with Card</button>
</div>

<div id="checkout-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Secure Payment</h2>

    <input type="text" placeholder="Card Number" />
    <input type="text" placeholder="MM/YY" />
    <input type="text" placeholder="CVC" />
    <input type="text" placeholder="Name on Card" />

    <button onclick="placeOrder()">Complete Payment</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="app.js"></script>

</body>
