



<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Glow Skincare</title>



  <link rel="stylesheet" type="text/css" href="./styles.css">

</head>



<body>



<header class="hero">

  <div class="hero-content">



   <img src="logo.png" alt="Glow Skincare Logo" class="logo">





    <p class="tagline">

      Radiance starts with self-care

    </p>



  </div>

</header>



<section class="products" id="product-list"></section>



<div class="cart">

  <h2>Your Cart</h2>

  <ul id="cart-items"></ul>

  <p>Total: $<span id="total">0</span></p>

  <button onclick="checkout()">Pay with Card</button>

</div>



<!-- Checkout Modal -->

<div id="checkout-modal" class="modal hidden">

  <div class="modal-content">

    <h2>Card Payment</h2>



    <input type="text" placeholder="Card Number" />

    <input type="text" placeholder="Expiry Date (MM/YY)" />

    <input type="text" placeholder="CVC" />

    <input type="text" placeholder="Name on Card" />



    <button onclick="placeOrder()">Complete Payment</button>

    <button onclick="closeModal()">Cancel</button>

  </div>

</div>



<script src="app.js"></script>



</body>

</html>
